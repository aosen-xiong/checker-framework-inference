task repairLocalizationStubSources(type: JavaExec, dependsOn: [testClasses]) {
    description 'Generate minimal Java source stubs for missing dependency symbols in a localization-study CSV. Configure with -PrepairLocalizationStubCsv.'
    group 'Verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'checkers.inference.repair.InferenceLocalizationStubSourceMain'
    if (!isJava8) {
        jvmArgs compilerArgsForRunningCF
    }
    doFirst {
        if (!project.hasProperty('repairLocalizationStubCsv')
                && !project.hasProperty('repairLocalizationStubCsvs')) {
            throw new GradleException('Set -PrepairLocalizationStubCsv=path/to/report.csv or -PrepairLocalizationStubCsvs=report1.csv,report2.csv')
        }
        def stubArgs = []
        if (project.hasProperty('repairLocalizationStubCsv')) {
            stubArgs += ['--csv', project.property('repairLocalizationStubCsv')]
        }
        if (project.hasProperty('repairLocalizationStubCsvs')) {
            project.property('repairLocalizationStubCsvs').split(',').each { csv ->
                if (csv.trim()) {
                    stubArgs += ['--csv', csv.trim()]
                }
            }
        }
        stubArgs += [
                '--out-dir',
                project.findProperty('repairLocalizationStubOutputDir') ?: "${buildDir}/inference-localization-study/stubs"
        ]
        if (project.hasProperty('repairLocalizationStubSourceListOutput')) {
            stubArgs += [
                    '--source-list-out',
                    project.property('repairLocalizationStubSourceListOutput')
            ]
        }
        if (project.hasProperty('repairLocalizationStubProjectRoot')) {
            stubArgs += [
                    '--project-root',
                    project.property('repairLocalizationStubProjectRoot')
            ]
        }
        args = stubArgs
    }
}

