buildscript {
    dependencies {
        if (JavaVersion.current() >= JavaVersion.VERSION_11) {
            // Code formatting; defines targets "spotlessApply" and "spotlessCheck".
            // https://github.com/diffplug/spotless/tags ; see tags starting "gradle/"
            // Only works on JDK 11+.
            classpath 'com.diffplug.spotless:spotless-plugin-gradle:6.22.0'
        }
    }
}

plugins {
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

apply plugin: 'java'

// Note:  For this setup to work you must follow the instructions outlined in the
//       checker manual Section 25.3 "Building from Source"
// http://types.cs.washington.edu/checker-framework/current/checkers-manual.html#build-source

ext {
    jsr308 = System.getenv('JSR308') ?: file(new File("..")).absolutePath
    checkerFrameworkPath = System.getenv('CHECKERFRAMEWORK') ?: "${jsr308}/checker-framework"
    checkerJar = "${checkerFrameworkPath}/checker/dist/checker.jar"
    afu = "${jsr308}/annotation-tools/annotation-file-utilities"
    lingelingTar = "${projectDir}/lib/lingeling.tar.gz"
    dljcScript = "${jsr308}/do-like-javac/dljc"

    // On a Java 8 JVM, use error-prone javac and source/target 8.
    // On a Java 9+ JVM, use the host javac, default source/target, and required module flags.
    isJava8 = JavaVersion.current() == JavaVersion.VERSION_1_8
    isJava11plus = JavaVersion.current() >= JavaVersion.VERSION_11
    errorproneJavacVersion = '9+181-r4173-1'

    // Keep in sync with checker-framework/build.gradle.
    // TODO: find a way to directly use that variable.
    compilerArgsForRunningCF = [
        "--add-exports",
        "jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
        "--add-exports",
        "jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
        "--add-exports",
        "jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
        "--add-exports",
        "jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
        "--add-exports",
        "jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED",
        "--add-exports",
        "jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
        "--add-exports",
        "jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
        "--add-exports",
        "jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
        "--add-opens",
        "jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
    ]
    if (isJava11plus) {
        apply plugin: 'com.diffplug.spotless'
        spotless {
            format 'misc', {
                target '*.md', '*.tex', '.gitignore', 'Makefile'
                indentWithSpaces(2)
                trimTrailingWhitespace()
            }

            java {
                googleJavaFormat().aosp()
                importOrder('com', 'jdk', 'lib', 'lombok', 'org', 'java', 'javax')
                formatAnnotations().addTypeAnnotation("PolyInitialized")
            }

            groovyGradle {
                target '**/*.gradle'
                greclipse()  // which formatter Spotless should use to format .gradle files.
                indentWithSpaces(4)
                trimTrailingWhitespace()
            }
        }
    }
}

println '===================================='
println '    Checker Framework Inference     '
println '===================================='
println ''
println '-------------------------------'
println 'Important Environment Variables'
println '-------------------------------'
println 'CHECKERFRAMEWORK: ' + checkerFrameworkPath

repositories {
    mavenCentral()
}

configurations {
    javacJar
}

dependencies {
    if (isJava8) {
        javacJar group: 'com.google.errorprone', name: 'javac', version: "$errorproneJavacVersion"
    }

    implementation files("${checkerJar}")
    implementation group: 'com.google.errorprone', name: 'javac', version: "$errorproneJavacVersion"

    implementation 'org.plumelib:options:1.0.5'
    implementation 'org.plumelib:plume-util:1.8.1'

    implementation 'com.google.guava:guava:31.1-jre'

    // AFU is an "includedBuild" imported in settings.gradle, so the version number doesn't matter.
    // https://docs.gradle.org/current/userguide/composite_builds.html#settings_defined_composite
    implementation('io.github.eisop:annotation-file-utilities:*') {
        exclude group: 'com.google.errorprone', module: 'javac'
    }

    // Serialize constraints
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    // Pretty print serialized constraints
    implementation 'com.google.code.gson:gson:2.9.1'

    implementation 'org.ow2.sat4j:org.ow2.sat4j.core:2.3.6'
    implementation 'org.ow2.sat4j:org.ow2.sat4j.maxsat:2.3.6'

    implementation 'tools.aqua:z3-turnkey:4.11.2'

    testImplementation fileTree(dir: "${checkerFrameworkPath}/framework-test/build/libs", include: "framework-test-*.jar")
    // Mocking library. Used in a couple tests
    testImplementation 'org.mockito:mockito-all:2.0.2-beta'
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    main {
        java {
            srcDirs = ["src"]
        }

        resources {
            srcDir "src"
            include "**/*.astub"
        }
    }

    test {
        java {
            srcDirs = ["tests"]
        }
    }
}

task buildLingeling(type: Exec) {
    description 'Build Lingeling solver'
    onlyIf { !(new File(lingelingTar).exists()) }
    workingDir './scripts'
    commandLine './buildLingeling'
}

task buildDLJC(type: Exec) {
    description 'Build DLJC Tool'
    onlyIf { !(new File(dljcScript).exists()) }
    workingDir './scripts'
    commandLine './buildDLJC'
}

def configureCheckerFrameworkInferenceTest = { Test testTask ->
    testTask.dependsOn(shadowJar)
    testTask.dependsOn('dist')

    testTask.systemProperties 'path.afu.scripts': "${afu}/scripts",
    'path.inference.script': "${projectDir}/scripts/inference",
    'use.hacks': true,
    JDK_JAR: "${checkerFrameworkPath}/checker/dist/jdk8.jar"

    if (project.hasProperty('emit.test.debug')) {
        testTask.systemProperties += ["emit.test.debug": 'true']
    }

    if (isJava8) {
        testTask.jvmArgs += [
            "-Xbootclasspath/p:${configurations.javacJar.asPath}"
        ]
    } else {
        // Without this, some tests throw "java.lang.OutOfMemoryError: Java heap space".
        // Corresponding pull request: https://github.com/opprop/checker-framework-inference/pull/263
        testTask.forkEvery(1)
        testTask.jvmArgs += compilerArgsForRunningCF
    }

    // Always run the tests.
    testTask.outputs.upToDateWhen { false }

    testTask.testLogging {
        // The following prints out each time a test is passed.
        // events "passed", "skipped", "failed", "standardOut", "standardError"
        def testsWithPublishedOutput = [
                "CheckerDiagnosticCaptureTest",
                "RepairDryRunReportTest",
                "InferenceFirstPipelineTest",
                "MaxSat2TypeSolverUnsatTest",
                "InferenceConstraintContextTest",
                "InferenceUnsatRepairPipelineTest",
        ] as Set
        if (testsWithPublishedOutput.contains(testTask.name)) {
            events "failed", "standardOut", "standardError"
        } else {
            events "failed"
        }
        // Show the found unexpected diagnostics and expected diagnostics not found.
        exceptionFormat "full"
    }

    // After each test, print a summary.
    testTask.afterSuite { desc, result ->
        if (desc.getClassName() != null) {
            long mils = result.getEndTime() - result.getStartTime()
            double seconds = mils / 1000.0

            println "Testsuite: ${desc.getClassName()}\n" +
                    "Tests run: ${result.testCount}, " +
                    "Failures: ${result.failedTestCount}, " +
                    "Skipped: ${result.skippedTestCount}, " +
                    "Time elapsed: ${seconds} sec\n"
        }
    }
}

compileJava {
    dependsOn(buildLingeling)
    dependsOn(buildDLJC)
    options.compilerArgs = [
        '-implicit:class',
        '-Awarns',
        '-Xmaxwarns',
        '10000',
        // Can't use this because JSON library contains raw types:
        // '-Xlint:unchecked',
        '-Xlint:deprecation',
        '-Werror',
    ]
}

// Exclude parts of the build directory that don't include classes from being packaged in
// the jar file.
// IMPORTANT: If "libs" is packaged in the JAR file you end up with an infinitely
// recursive jar task that will fill up your hard drive (eventually)
jar {
    description = 'Makes a jar with ONLY the classes compiled for checker ' +
            'framework inference and NONE of its dependencies'
    archiveFileName = "checker-framework-inference.jar"
    manifest.attributes("Main-Class": "checkers.inference.InferenceLauncher")
    exclude("dependency-cache", "libs", "tmp")
}

shadowJar {
    dependencies {
        exclude(dependency("junit:.*:.*"))
    }
    description 'Creates the "fat" checker.jar in dist'
    destinationDirectory = file("${projectDir}/dist")
    archiveFileName = "checker-framework-inference.jar"
}

task dist(dependsOn: shadowJar, type: Copy) {
    description = "If your Checker Framework project is fully built, this task " +
            "will build checker-framework-inference.jar, copy all the relevant runtime jars into " +
            "the dist directory."
    from files(
            "${checkerFrameworkPath}/checker/dist/checker.jar",
            "${checkerFrameworkPath}/checker/dist/checker-qual.jar",
            "${checkerFrameworkPath}/checker/dist/checker-util.jar",
            "${checkerFrameworkPath}/checker/dist/javac.jar",
            )
    into file('dist')
}

task dependenciesJar(dependsOn: dist, type: Jar) {
    description 'Create a jar file with all the dependencies.'
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    archiveFileName = 'dependencies.jar'
    destinationDirectory = file("${projectDir}/dist/")
}

task testLibJar(dependsOn: dist, type: Jar) {
    from sourceSets.test.output.classesDirs
    include ('checkers/inference/test/**')
    archiveFileName = 'inference-framework-test-lib.jar'
    destinationDirectory = file("${projectDir}/dist/")
}

tasks.clean {
    delete += "build/libs/checker-framework-inference.zip"
    delete += "jdk8.jar"
    delete += "javac.jar"
    delete += fileTree('dist') {
        include '**/*.jar'
    }
}


task release(type: Zip) {
    from('src') {
        into('release/src')
    }

    from('dist') {
        into('release/dist')
    }
    from('scripts') {
        into('release/scripts')
        include '*.py'
    }

    archiveBaseName = 'release'
}

task cloneAndBuildDependencies(type: Exec) {
    description 'Clones (or updates) and builds all dependencies'
    executable './.ci-build-without-test.sh'
}

task testCheckerInferenceScript(type: Exec, dependsOn: dist) {
    description 'Basic sanity check of scripts/inference'
    executable './scripts/inference'
    args = [
        '--mode',
        'TYPECHECK',
        '--checker',
        'ostrusted.OsTrustedChecker',
        '--solver',
        'checkers.inference.solver.PropagationSolver',
        'testdata/ostrusted/Test.java'
    ]
}

task testCheckerInferenceDevScript(type: Exec, dependsOn: [dist, dependenciesJar]) {
    description 'Basic sanity check of scripts/inference-dev'
    executable './scripts/inference-dev'
    args = [
        '--mode',
        'INFER',
        '--checker',
        'interning.InterningChecker',
        '--solver',
        'checkers.inference.solver.MaxSat2TypeSolver',
        '--hacks=true',
        'testdata/interning/MapAssignment.java'
    ]
}

task testDataflowExternalSolvers(type: Exec, dependsOn: [dist, dependenciesJar]) {
    description 'Test Dataflow type system on its external solvers Lingeling and LogicBlox'
    executable './testing/dataflowexample/ci-test.sh'
}

task repairExperimentReport(type: JavaExec, dependsOn: [testClasses, dist]) {
    description 'Run an inference-repair experiment and write a JSON report. Configure with -PrepairExperimentSources or -PrepairExperimentSourceList.'
    group 'Verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'checkers.inference.repair.InferenceRepairExperimentMain'
    systemProperties 'path.afu.scripts': "${afu}/scripts"
    if (!isJava8) {
        jvmArgs compilerArgsForRunningCF
    }
    doFirst {
        def reportArgs = []
        reportArgs += ['--mode', project.findProperty('repairExperimentMode') ?: 'UNSAT_CORE_GUIDED']
        reportArgs += [
                '--edit-provider-mode',
                project.findProperty('repairExperimentEditProviderMode') ?: 'DETERMINISTIC_ONLY'
        ]
        reportArgs += [
                '--out',
                project.findProperty('repairExperimentOutput') ?: "${buildDir}/inference-repair-experiments/report.json"
        ]
        if (project.hasProperty('repairExperimentProjectName')) {
            reportArgs += ['--project-name', project.property('repairExperimentProjectName')]
        }
        if (project.hasProperty('repairExperimentProjectRoot')) {
            reportArgs += ['--project-root', project.property('repairExperimentProjectRoot')]
        }
        if (project.hasProperty('repairExperimentRevision')) {
            reportArgs += ['--revision', project.property('repairExperimentRevision')]
        }
        if (project.hasProperty('repairExperimentSourceList')) {
            reportArgs += ['--source-list', project.property('repairExperimentSourceList')]
        }
        if (project.hasProperty('repairExperimentSourceRoots')) {
            project.property('repairExperimentSourceRoots').split(',').each { sourceRoot ->
                if (sourceRoot.trim()) {
                    reportArgs += ['--source-root', sourceRoot.trim()]
                }
            }
        }
        if (project.hasProperty('repairExperimentSources')) {
            project.property('repairExperimentSources').split(',').each { source ->
                if (source.trim()) {
                    reportArgs += ['--source', source.trim()]
                }
            }
        }
        if (!project.hasProperty('repairExperimentSourceList')
                && !project.hasProperty('repairExperimentSources')
                && !project.hasProperty('repairExperimentSourceRoots')) {
            throw new GradleException('Set -PrepairExperimentSources=path1,path2, -PrepairExperimentSourceList=file, or -PrepairExperimentSourceRoots=dir1,dir2')
        }
        args = reportArgs
    }
}

task repairExperimentCompare(type: JavaExec, dependsOn: [testClasses]) {
    description 'Compare inference-repair JSON reports and write a CSV summary. Configure with -PrepairExperimentReports or -PrepairExperimentReportList.'
    group 'Verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'checkers.inference.repair.InferenceRepairExperimentCompareMain'
    if (!isJava8) {
        jvmArgs compilerArgsForRunningCF
    }
    doFirst {
        def compareArgs = []
        compareArgs += [
                '--out',
                project.findProperty('repairExperimentComparisonOutput') ?: "${buildDir}/inference-repair-experiments/comparison.csv"
        ]
        if (project.hasProperty('repairExperimentReportList')) {
            compareArgs += ['--report-list', project.property('repairExperimentReportList')]
        }
        if (project.hasProperty('repairExperimentReports')) {
            project.property('repairExperimentReports').split(',').each { report ->
                if (report.trim()) {
                    compareArgs += ['--report', report.trim()]
                }
            }
        }
        if (!project.hasProperty('repairExperimentReportList')
                && !project.hasProperty('repairExperimentReports')) {
            throw new GradleException('Set -PrepairExperimentReports=report1,report2 or -PrepairExperimentReportList=file')
        }
        args = compareArgs
    }
}

task repairLocalizationStudyReport(type: JavaExec, dependsOn: [testClasses, dist]) {
    description 'Run the CFI nullability localization pilot-study report. Configure with -PrepairLocalizationSources, -PrepairLocalizationSourceList, or -PrepairLocalizationSourceRoots.'
    group 'Verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'checkers.inference.repair.InferenceLocalizationStudyMain'
    systemProperties 'path.afu.scripts': "${afu}/scripts"
    if (!isJava8) {
        jvmArgs compilerArgsForRunningCF
    }
    doFirst {
        def reportArgs = []
        reportArgs += [
                '--out',
                project.findProperty('repairLocalizationOutput') ?: "${buildDir}/inference-localization-study/report.json"
        ]
        if (project.hasProperty('repairLocalizationCsvOutput')) {
            reportArgs += ['--csv-out', project.property('repairLocalizationCsvOutput')]
        }
        reportArgs += ['--sample-size', project.findProperty('repairLocalizationSampleSize') ?: '100']
        reportArgs += ['--seed', project.findProperty('repairLocalizationSeed') ?: '1']
        reportArgs += ['--top-k', project.findProperty('repairLocalizationTopK') ?: '5']
        reportArgs += [
                '--timeout-seconds',
                project.findProperty('repairLocalizationTimeoutSeconds') ?: '60'
        ]
        if (project.findProperty('repairLocalizationInProcess') == 'true') {
            reportArgs += ['--in-process']
        }
        if (project.findProperty('repairLocalizationValidateSourceRepairPlans') == 'true') {
            reportArgs += ['--validate-source-repair-plans']
        }
        if (project.hasProperty('repairLocalizationSourceFilter')) {
            reportArgs += ['--source-filter', project.property('repairLocalizationSourceFilter')]
        }
        if (project.hasProperty('repairLocalizationProjectName')) {
            reportArgs += ['--project-name', project.property('repairLocalizationProjectName')]
        }
        if (project.hasProperty('repairLocalizationProjectRoot')) {
            reportArgs += ['--project-root', project.property('repairLocalizationProjectRoot')]
        }
        if (project.hasProperty('repairLocalizationRevision')) {
            reportArgs += ['--revision', project.property('repairLocalizationRevision')]
        }
        if (project.hasProperty('repairLocalizationSourceList')) {
            reportArgs += ['--source-list', project.property('repairLocalizationSourceList')]
        }
        if (project.hasProperty('repairLocalizationCompanionSourceList')) {
            reportArgs += [
                    '--companion-source-list',
                    project.property('repairLocalizationCompanionSourceList')
            ]
        }
        if (project.hasProperty('repairLocalizationCompanionSourceLists')) {
            project.property('repairLocalizationCompanionSourceLists').split(',').each { sourceList ->
                if (sourceList.trim()) {
                    reportArgs += ['--companion-source-list', sourceList.trim()]
                }
            }
        }
        if (project.hasProperty('repairLocalizationJavacOptionsFile')) {
            reportArgs += [
                    '--javac-options-file',
                    project.property('repairLocalizationJavacOptionsFile')
            ]
        }
        if (project.hasProperty('repairLocalizationJavacOptions')) {
            project.property('repairLocalizationJavacOptions').split(',').each { javacOption ->
                if (javacOption.trim()) {
                    reportArgs += ['--javac-option', javacOption.trim()]
                }
            }
        }
        if (project.hasProperty('repairLocalizationSourceRoots')) {
            project.property('repairLocalizationSourceRoots').split(',').each { sourceRoot ->
                if (sourceRoot.trim()) {
                    reportArgs += ['--source-root', sourceRoot.trim()]
                }
            }
        }
        if (project.hasProperty('repairLocalizationSources')) {
            project.property('repairLocalizationSources').split(',').each { source ->
                if (source.trim()) {
                    reportArgs += ['--source', source.trim()]
                }
            }
        }
        if (project.hasProperty('repairLocalizationCompanionSources')) {
            project.property('repairLocalizationCompanionSources').split(',').each { source ->
                if (source.trim()) {
                    reportArgs += ['--companion-source', source.trim()]
                }
            }
        }
        if (!project.hasProperty('repairLocalizationSourceList')
                && !project.hasProperty('repairLocalizationSources')
                && !project.hasProperty('repairLocalizationSourceRoots')) {
            throw new GradleException('Set -PrepairLocalizationSources=path1,path2, -PrepairLocalizationSourceList=file, or -PrepairLocalizationSourceRoots=dir1,dir2')
        }
        args = reportArgs
    }
}

task repairSourceList(type: JavaExec, dependsOn: [testClasses]) {
    description 'Write a reproducible Java source list for repair/localization experiments. Configure with -PrepairSourceListRoots.'
    group 'Verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'checkers.inference.repair.InferenceRepairSourceListMain'
    if (!isJava8) {
        jvmArgs compilerArgsForRunningCF
    }
    doFirst {
        def sourceListArgs = []
        sourceListArgs += [
                '--out',
                project.findProperty('repairSourceListOutput') ?: "${buildDir}/inference-repair-source-lists/sources.txt"
        ]
        if (project.hasProperty('repairSourceListRelativeTo')) {
            sourceListArgs += ['--relative-to', project.property('repairSourceListRelativeTo')]
        }
        if (project.hasProperty('repairSourceListFilter')) {
            sourceListArgs += ['--source-filter', project.property('repairSourceListFilter')]
        }
        if (project.hasProperty('repairSourceListRoots')) {
            project.property('repairSourceListRoots').split(',').each { sourceRoot ->
                if (sourceRoot.trim()) {
                    sourceListArgs += ['--source-root', sourceRoot.trim()]
                }
            }
        } else {
            throw new GradleException('Set -PrepairSourceListRoots=dir1,dir2')
        }
        args = sourceListArgs
    }
}

task repairBenchmarkSourceLists(type: JavaExec, dependsOn: [testClasses]) {
    description 'Write one Java source list per immediate child project under a benchmark root.'
    group 'Verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'checkers.inference.repair.InferenceBenchmarkSourceListsMain'
    if (!isJava8) {
        jvmArgs compilerArgsForRunningCF
    }
    doFirst {
        if (!project.hasProperty('repairBenchmarkRoot')) {
            throw new GradleException('Set -PrepairBenchmarkRoot=path/to/benchmarks')
        }
        def sourceListArgs = []
        sourceListArgs += ['--benchmark-root', project.property('repairBenchmarkRoot')]
        sourceListArgs += [
                '--out-dir',
                project.findProperty('repairBenchmarkSourceListOutputDir') ?: "${buildDir}/inference-repair-source-lists"
        ]
        if (project.hasProperty('repairBenchmarkSourceListFilter')) {
            sourceListArgs += [
                    '--source-filter',
                    project.property('repairBenchmarkSourceListFilter')
            ]
        }
        if (project.hasProperty('repairBenchmarkIncludeProjects')) {
            sourceListArgs += [
                    '--include-projects',
                    project.property('repairBenchmarkIncludeProjects')
            ]
        }
        if (project.hasProperty('repairBenchmarkExcludeProjects')) {
            sourceListArgs += [
                    '--exclude-projects',
                    project.property('repairBenchmarkExcludeProjects')
            ]
        }
        args = sourceListArgs
    }
}

task repairNullRepairManualSourceLists(type: JavaExec, dependsOn: [testClasses]) {
    description 'Write per-project source lists from a NullRepair manual-inspection scoring TSV.'
    group 'Verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'checkers.inference.repair.NullRepairManualInspectionSourceListsMain'
    if (!isJava8) {
        jvmArgs compilerArgsForRunningCF
    }
    doFirst {
        if (!project.hasProperty('repairNullRepairManualInspectionTsv')) {
            throw new GradleException('Set -PrepairNullRepairManualInspectionTsv=path/to/manual_inspection_scoring.tsv')
        }
        def sourceListArgs = []
        sourceListArgs += ['--input', project.property('repairNullRepairManualInspectionTsv')]
        sourceListArgs += [
                '--out-dir',
                project.findProperty('repairNullRepairManualSourceListOutputDir') ?: "${buildDir}/inference-repair-source-lists/nullrepair-manual"
        ]
        if (project.hasProperty('repairNullRepairManualIncludeProjects')) {
            sourceListArgs += [
                    '--include-projects',
                    project.property('repairNullRepairManualIncludeProjects')
            ]
        }
        if (project.hasProperty('repairNullRepairManualExcludeProjects')) {
            sourceListArgs += [
                    '--exclude-projects',
                    project.property('repairNullRepairManualExcludeProjects')
            ]
        }
        if (project.hasProperty('repairNullRepairManualMaxBestScore')) {
            sourceListArgs += [
                    '--max-best-score',
                    project.property('repairNullRepairManualMaxBestScore')
            ]
        }
        args = sourceListArgs
    }
}

task repairNullRepairManualMaterialize(type: JavaExec, dependsOn: [testClasses]) {
    description 'Materialize source files referenced by a NullRepair manual-inspection scoring TSV.'
    group 'Verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'checkers.inference.repair.NullRepairManualInspectionMaterializerMain'
    if (!isJava8) {
        jvmArgs compilerArgsForRunningCF
    }
    doFirst {
        if (!project.hasProperty('repairNullRepairManualInspectionTsv')) {
            throw new GradleException('Set -PrepairNullRepairManualInspectionTsv=path/to/manual_inspection_scoring.tsv')
        }
        def materializeArgs = []
        materializeArgs += ['--input', project.property('repairNullRepairManualInspectionTsv')]
        materializeArgs += [
                '--out-root',
                project.findProperty('repairNullRepairManualMaterializedRoot') ?: "${buildDir}/nullrepair-manual-materialized/benchmarks"
        ]
        materializeArgs += [
                '--source-list-out-dir',
                project.findProperty('repairNullRepairManualSourceListOutputDir') ?: "${buildDir}/nullrepair-manual-materialized/source-lists"
        ]
        if (project.hasProperty('repairNullRepairManualTargetSourceListOutputDir')) {
            materializeArgs += [
                    '--target-source-list-out-dir',
                    project.property('repairNullRepairManualTargetSourceListOutputDir')
            ]
        }
        materializeArgs += [
                '--case-manifest-out',
                project.findProperty('repairNullRepairManualCaseManifestOutput') ?: "${buildDir}/nullrepair-manual-materialized/case-manifest.csv"
        ]
        if (project.hasProperty('repairNullRepairManualBenchmarkRoot')) {
            materializeArgs += [
                    '--benchmark-root',
                    project.property('repairNullRepairManualBenchmarkRoot')
            ]
        } else if (project.hasProperty('repairNullRepairManualArtifactBenchmarksUrl')) {
            materializeArgs += [
                    '--artifact-benchmarks-url',
                    project.property('repairNullRepairManualArtifactBenchmarksUrl')
            ]
        } else if (project.findProperty('repairNullRepairManualUseDefaultArtifactUrl') == 'true') {
            materializeArgs += ['--use-default-artifact-url']
        } else {
            throw new GradleException('Set -PrepairNullRepairManualBenchmarkRoot=path/to/benchmarks or -PrepairNullRepairManualUseDefaultArtifactUrl=true')
        }
        if (project.hasProperty('repairNullRepairManualIncludeProjects')) {
            materializeArgs += [
                    '--include-projects',
                    project.property('repairNullRepairManualIncludeProjects')
            ]
        }
        if (project.hasProperty('repairNullRepairManualExcludeProjects')) {
            materializeArgs += [
                    '--exclude-projects',
                    project.property('repairNullRepairManualExcludeProjects')
            ]
        }
        if (project.hasProperty('repairNullRepairManualMaxBestScore')) {
            materializeArgs += [
                    '--max-best-score',
                    project.property('repairNullRepairManualMaxBestScore')
            ]
        }
        if (project.hasProperty('repairNullRepairManualClosureDepth')) {
            materializeArgs += [
                    '--closure-depth',
                    project.property('repairNullRepairManualClosureDepth')
            ]
        }
        args = materializeArgs
    }
}

